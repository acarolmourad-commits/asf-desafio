<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Desafio 30 — 30 dias de evolução no surf | ASF</title><meta name="description" content="Desafio de 30 dias de evolução no surf: grade de progresso diária com hábitos de treino, mar e estudo. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-desafio/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:40px 20px 30px;text-align:center}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.grade{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.dia{aspect-ratio:1;background:#fff;border:2px solid #E5EEF2;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer}.dia.on{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;border-color:transparent}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(14,36,57,.06)}.bar{background:#E5EEF2;border-radius:99px;height:12px;overflow:hidden}.bar div{background:linear-gradient(90deg,var(--p),var(--u));height:100%;transition:width .3s}.muted{color:var(--g);font-size:12.5px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-desafio/">📈 Desafio 30</a><a href="https://acarolmourad-commits.github.io/asf-desafios/">🎯 Desafios</a><a href="https://acarolmourad-commits.github.io/asf-treino/">🏋️ Treino</a><a href="https://acarolmourad-commits.github.io/asf-sonhos/">🌠 Sonhos</a></nav><header><h1>📈 Desafio 30 dias</h1><p>Um dia de evolução por vez: marque cada dia cumprido.</p></header><main class="wrap"><div class="card"><div class="muted"><span id="n">0</span>/30 dias · <span id="pct">0</span>%</div><div class="bar" style="margin-top:8px"><div id="bar" style="width:0%"></div></div><div class="grade" id="grade"></div><div class="muted">Toque no dia para marcar/desmarcar. Ideias de treino no <a href="https://acarolmourad-commits.github.io/asf-treino/">ASF Treino</a>.</div></div></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>const K='asf-desafio30-v1';let st=JSON.parse(localStorage.getItem(K)||'{}');const g=document.getElementById('grade');for(let i=1;i<=30;i++){const d=document.createElement('div');d.className='dia'+(st[i]?' on':'');d.textContent=i;d.onclick=()=>{st[i]=!st[i];d.classList.toggle('on');localStorage.setItem(K,JSON.stringify(st));att();};g.appendChild(d);}function att(){let n=0;for(let i=1;i<=30;i++)st[i]&&n++;document.getElementById('n').textContent=n;const p=Math.round(n/30*100);document.getElementById('pct').textContent=p;document.getElementById('bar').style.width=p+'%';}att();</script></body></html>
